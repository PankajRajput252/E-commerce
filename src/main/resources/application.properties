# ==============================
# Push notifications (Firebase Cloud Messaging) — mobile app chat alerts
# Set ONE of these on the server (never commit the key file):
#   FIREBASE_CREDENTIALS_FILE   = path to the service-account JSON
#   FIREBASE_CREDENTIALS_BASE64 = the same JSON, base64-encoded
# Leave both empty and the backend runs normally with pushes turned off.
# ==============================
firebase.credentials-file=${FIREBASE_CREDENTIALS_FILE:}
firebase.credentials-base64=${FIREBASE_CREDENTIALS_BASE64:}

# ==============================
# Browser push notifications (standard Web Push / VAPID) — website chat alerts,
# delivered even when no Bandookwale tab is open. Set on the server:
#   VAPID_PUBLIC_KEY  = base64url public key (also served to the website)
#   VAPID_PRIVATE_KEY = base64url private key (keep secret, never commit)
# Generate a pair once and keep it: changing keys invalidates every browser subscription.
#   node -e "const c=require('crypto');const k=c.generateKeyPairSync('ec',{namedCurve:'prime256v1'}).privateKey.export({format:'jwk'});const b=s=>Buffer.from(s,'base64url');console.log('VAPID_PUBLIC_KEY='+Buffer.concat([Buffer.from([4]),b(k.x),b(k.y)]).toString('base64url'));console.log('VAPID_PRIVATE_KEY='+k.d)"
# Leave empty and the backend runs normally with web push turned off.
# ==============================
webpush.public-key=${VAPID_PUBLIC_KEY:}
webpush.private-key=${VAPID_PRIVATE_KEY:}
webpush.subject=${VAPID_SUBJECT:https://bandookwale.com}

# ==============================
# Consultations (book a slot → email + Google Meet link)
# Google OAuth client (Google Cloud console → APIs & Services → Credentials → OAuth client ID, type "Web application"):
#   GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET
#   GOOGLE_OAUTH_REDIRECT_URI = https://api.bandookwale.com/api/consultations/google/callback  (must match the console exactly)
# Then an admin clicks "Connect Google account" in Admin → Consultations once.
# Without these, bookings still work; admins paste Meet links by hand.
# ==============================
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:}
# Where Google sends the admin back to after connecting, and links in emails
consultation.frontend-url=${CONSULTATION_FRONTEND_URL:https://bandookwale.com}
consultation.timezone=Asia/Kolkata
# Booking confirmations are copied to this inbox (defaults to spring.mail.username)
consultation.admin-email=${CONSULTATION_ADMIN_EMAIL:${spring.mail.username}}
# Slots starting sooner than this can't be booked
consultation.min-lead-minutes=60
